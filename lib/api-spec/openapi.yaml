openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AHmazing Foods API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: menu
    description: Menu items
  - name: orders
    description: Bookings and orders
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /menu-items:
    get:
      operationId: listMenuItems
      tags: [menu]
      summary: List menu items
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [soups, stews, breakfast]
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"

  /menu-items/{id}:
    get:
      operationId: getMenuItem
      tags: [menu]
      summary: Get a menu item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders (admin)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, confirmed, cooking, delivered, cancelled]
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/summary:
    get:
      operationId: getOrderSummary
      tags: [orders]
      summary: Admin dashboard summary
      responses:
        "200":
          description: Order summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummary"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a single order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SizeOption:
      type: object
      required: [label, price]
      properties:
        label:
          type: string
          description: "e.g. '1L', '3L', '5L'"
        price:
          type: integer
          description: Price in Naira (kobo-free integer)

    ProteinOption:
      type: object
      required: [name, extraCost]
      properties:
        name:
          type: string
          description: "e.g. 'Goat Meat', 'Assorted'"
        extraCost:
          type: integer
          description: Extra cost in Naira

    MenuItem:
      type: object
      required: [id, category, name, description, sizes, proteins, available]
      properties:
        id:
          type: integer
        category:
          type: string
          enum: [soups, stews, breakfast]
        name:
          type: string
        description:
          type: string
        sizes:
          type: array
          items:
            $ref: "#/components/schemas/SizeOption"
        proteins:
          type: array
          items:
            $ref: "#/components/schemas/ProteinOption"
        available:
          type: boolean
        imageUrl:
          type: ["string", "null"]

    Order:
      type: object
      required:
        - id
        - menuItemId
        - menuItemName
        - category
        - selectedSize
        - selectedProtein
        - customerName
        - customerPhone
        - deliveryDate
        - deliverySlot
        - itemPrice
        - rushFee
        - total
        - status
        - createdAt
      properties:
        id:
          type: integer
        menuItemId:
          type: integer
        menuItemName:
          type: string
        category:
          type: string
          enum: [soups, stews, breakfast]
        selectedSize:
          type: string
        selectedProtein:
          type: ["string", "null"]
        customerName:
          type: string
        customerPhone:
          type: string
        customerEmail:
          type: ["string", "null"]
        deliveryAddress:
          type: ["string", "null"]
        deliveryDate:
          type: string
          format: date
        deliverySlot:
          type: string
        itemPrice:
          type: integer
        rushFee:
          type: integer
        total:
          type: integer
        status:
          type: string
          enum: [pending, confirmed, cooking, delivered, cancelled]
        paystackRef:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    OrderInput:
      type: object
      required:
        - menuItemId
        - selectedSize
        - customerName
        - customerPhone
        - deliveryDate
        - deliverySlot
      properties:
        menuItemId:
          type: integer
        selectedSize:
          type: string
        selectedProtein:
          type: ["string", "null"]
        customerName:
          type: string
        customerPhone:
          type: string
        customerEmail:
          type: ["string", "null"]
        deliveryAddress:
          type: ["string", "null"]
        deliveryDate:
          type: string
          format: date
        deliverySlot:
          type: string
        paystackRef:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, cooking, delivered, cancelled]

    OrderSummary:
      type: object
      required:
        - totalOrders
        - pendingOrders
        - confirmedOrders
        - cookingOrders
        - deliveredOrders
        - cancelledOrders
        - totalRevenue
        - todayOrders
        - todayRevenue
        - recentOrders
      properties:
        totalOrders:
          type: integer
        pendingOrders:
          type: integer
        confirmedOrders:
          type: integer
        cookingOrders:
          type: integer
        deliveredOrders:
          type: integer
        cancelledOrders:
          type: integer
        totalRevenue:
          type: integer
        todayOrders:
          type: integer
        todayRevenue:
          type: integer
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
